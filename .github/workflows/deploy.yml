name: Build and Deploy to CCE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Huawei Cloud SWR
        uses: docker/login-action@v3
        with:
          registry: swr.cn-north-4.myhuaweicloud.com
          username: cn-north-4@${{ secrets.HW_AK }}
          password: ${{ secrets.HW_SK }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.backend
          push: true
          tags: swr.cn-north-4.myhuaweicloud.com/cloud-56/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: swr.cn-north-4.myhuaweicloud.com/cloud-56/frontend:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          kubectl config use-context external
          kubectl version --client

      - name: Ensure imagePullSecrets on deployments
        env:
          HW_AK: ${{ secrets.HW_AK }}
          HW_SK: ${{ secrets.HW_SK }}
        run: |
          # Create/update swr-secret in default namespace
          kubectl create secret docker-registry swr-secret \
            --docker-server=swr.cn-north-4.myhuaweicloud.com \
            --docker-username="cn-north-4@${HW_AK}" \
            --docker-password="${HW_SK}" \
            -n default --dry-run=client -o yaml | kubectl apply -f -

          # Clean up stuck ReplicaSets from previous failed rollouts
          kubectl delete rs -l app=backend --field-selector="status.replicas=0" --now 2>/dev/null || true
          kubectl delete rs -l app=frontend --field-selector="status.replicas=0" --now 2>/dev/null || true

          # Scale down to force new ReplicaSet with imagePullSecrets
          kubectl scale deployment/backend -n default --replicas=0
          sleep 3
          kubectl scale deployment/backend -n default --replicas=2
          sleep 3

      - name: Update backend deployment image
        run: |
          kubectl set image deployment/backend \
            backend=swr.cn-north-4.myhuaweicloud.com/cloud-56/backend:latest \
            -n default
          sleep 5
          kubectl get pods -o wide
          kubectl rollout status deployment/backend -n default --timeout=300s

      - name: Update frontend deployment image
        run: |
          # Scale down to force new ReplicaSet
          kubectl scale deployment/frontend -n default --replicas=0
          sleep 3
          kubectl scale deployment/frontend -n default --replicas=1
          sleep 3
          kubectl set image deployment/frontend \
            frontend=swr.cn-north-4.myhuaweicloud.com/cloud-56/frontend:latest \
            -n default
          sleep 5
          kubectl get pods -o wide
          kubectl rollout status deployment/frontend -n default --timeout=300s

      - name: Debug pods (if needed)
        if: failure()
        run: |
          kubectl describe pods -l app=backend -n default
          kubectl describe pods -l app=frontend -n default
          kubectl get events -n default --sort-by=.lastTimestamp | tail -20

      - name: Verify deployment
        run: |
          kubectl get pods -o wide
          kubectl get svc backend-svc
